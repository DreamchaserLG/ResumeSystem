name: Verify v1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: ci-resume
          POSTGRES_DB: resume
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U resume -d resume"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://resume:ci-resume@localhost:5432/resume
      APP_DATABASE_URL: postgresql://rs_app:ci-app@localhost:5432/resume
      RS_APP_PASSWORD: ci-app
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      STORAGE_ROOT: /tmp/resume-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --target "$RUNNER_TEMP/resume-cv" opencv-contrib-python-headless==4.10.0.84
          echo "PYTHONPATH=$RUNNER_TEMP/resume-cv" >> "$GITHUB_ENV"
      - name: Migrate, evaluate and test
        run: |
          python -m migrations.migrate
          python -m eval.v1_baseline
          python -m pytest -m 'not slow'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
